name: Publish to PyPI

on:
  release:
    types: [published]

# Least-privilege at workflow root (post-tj-actions/changed-files era, CVE-2025-30066).
# Publish job only reads the repo; PyPI auth is via TWINE_PASSWORD secret, so no
# elevated GitHub-token scope is required.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
